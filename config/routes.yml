# Ekran slajdera.
#
# `_legacy_controller` wskazuje własną zakładkę modułu (`AdminQuinceSlider`).
# Do niej odnoszą się uprawnienia pracownika: atrybuty `#[AdminSecurity]`
# w kontrolerach sprawdzają prawa do tej zakładki.
quince_slider:
  path: quince/slider
  methods: [GET]
  defaults:
    _controller: Quince\Slider\Controller\Admin\SlidesController::indexAction
    _legacy_controller: 'AdminQuinceSlider'
    _legacy_link: 'AdminQuince'

quince_slider_save:
  path: quince/slider/save
  methods: [POST]
  defaults:
    _controller: Quince\Slider\Controller\Admin\SlidesController::saveAction
    _legacy_controller: 'AdminQuinceSlider'
    _legacy_link: 'AdminQuince:save'
