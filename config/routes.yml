# Ekran slajdera.
#
# `_legacy_controller` wskazuje zakładkę silnika, bo moduł bez niego nie działa.
# Moduł nie ma własnej zakładki, więc PrestaShop sprawdza uprawnienia na
# zakładce silnika.
quince_slider:
  path: quince/slider
  methods: [GET]
  defaults:
    _controller: Quince\Slider\Controller\Admin\SlidesController::indexAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_slider_save:
  path: quince/slider/save
  methods: [POST]
  defaults:
    _controller: Quince\Slider\Controller\Admin\SlidesController::saveAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'
